<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Telugu Transliterate</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400&family=Noto+Sans+Telugu:wght@400&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0c0a08; --surface: #161310; --border: #2a2420;
    --amber: #e8a838; --text: #f0e6d3; --text-dim: #7a6a58;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Mono', monospace; padding: 20px; display: flex; flex-direction: column; align-items: center; }
  .container { width: 100%; max-width: 500px; }
  header { padding: 30px 0; text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 15px; }
  .label { font-size: 10px; letter-spacing: 2px; color: var(--text-dim); margin-bottom: 10px; text-transform: uppercase; }
  
  /* Input Area */
  textarea {
    width: 100%; background: #000; border: 1px solid var(--border);
    color: var(--text); font-family: 'Noto Sans Telugu', serif;
    font-size: 18px; padding: 12px; border-radius: 4px; resize: none; outline: none;
  }
  textarea:focus { border-color: var(--amber); }

  .mic-btn {
    width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--amber);
    background: transparent; color: var(--amber); display: flex; 
    align-items: center; justify-content: center; margin: 20px auto;
    transition: 0.3s;
  }
  .mic-btn.active { background: rgba(232, 168, 56, 0.2); transform: scale(1.1); }
  
  .output { color: var(--amber); font-size: 18px; min-height: 40px; padding: 10px; background: #000; border-radius: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 15px; }
  button.action { flex: 1; padding: 12px; background: transparent; border: 1px solid var(--border); color: var(--text); border-radius: 4px; }
  
  #status { text-align: center; font-size: 10px; color: var(--amber); margin-bottom: 10px; height: 15px; }
</style>
</head>
<body>

<div class="container">
  <header>
    <h2 style="font-family:'Playfair Display'">Telugu → English</h2>
    <p style="font-size:10px; color:var(--text-dim); letter-spacing:2px;">IPHONE OPTIMIZED</p>
  </header>

  <div id="status"></div>

  <div class="card">
    <div class="label">Input (Voice or Type)</div>
    <!-- We use a textarea so iPhone Chrome users can use the keyboard microphone -->
    <textarea id="teluguInput" rows="3" placeholder="Tap here and use keyboard mic..."></textarea>
    
    <button class="mic-btn" id="micBtn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
    </button>
  </div>

  <div class="card">
    <div class="label">English Transliteration</div>
    <div class="output" id="englishOutput">...</div>
    <div class="btn-row">
      <button class="action" onclick="copyText()">Copy</button>
      <button class="action" onclick="clearAll()">Clear</button>
    </div>
  </div>
</div>

<script>
const TELUGU_MAP = {
  'అ':'a','ఆ':'aa','ఇ':'i','ఈ':'ee','ఉ':'u','ఊ':'oo','ఋ':'ru','ఎ':'e','ఏ':'ae','ఐ':'ai','ఒ':'o','ఓ':'oo','ఔ':'au',
  'ా':'aa','ి':'i','ీ':'ee','ు':'u','ూ':'oo','ృ':'ru','ె':'e','ే':'ae','ై':'ai','ొ':'o','ో':'oo','ౌ':'au','ం':'m','ః':'h',
  'క':'ka','ఖ':'kha','గ':'ga','ఘ':'gha','ఙ':'nga','చ':'cha','ఛ':'chha','జ':'ja','ఝ':'jha','ఞ':'nya',
  'ట':'ta','ఠ':'tha','డ':'da','ఢ':'dha','ణ':'na','త':'tha','థ':'thha','ద':'da','ధ':'dha','న':'na',
  'ప':'pa','ఫ':'pha','బ':'ba','భ':'bha','మ':'ma','య':'ya','ర':'ra','ల':'la','వ':'va','శ':'sha','ష':'sha','స':'sa','హ':'ha','ళ':'la'
};

function transliterate(text) {
  let result = '';
  for (let i = 0; i < text.length; i++) {
    let char = text[i];
    let next = text[i+1];
    let mapped = TELUGU_MAP[char] || char;
    if (['క','ఖ','గ','ఘ','ఙ','చ','ఛ','జ','ఝ','ఞ','ట','ఠ','డ','ఢ','ణ','త','థ','ద','ధ','న','ప','ఫ','బ','భ','మ','య','ర','ల','వ','శ','ష','స','హ','ళ'].includes(char)) {
      if (next && (['ా','ి','ీ','ు','ూ','ృ','ె','ే','ై','ొ','ో','ౌ','ం','ః'].includes(next) || next === '్')) {
        mapped = mapped.replace(/a$/, '');
        if (next === '్') i++;
      }
    }
    result += mapped;
  }
  return result;
}

const inputArea = document.getElementById('teluguInput');
const outputDiv = document.getElementById('englishOutput');
const statusDiv = document.getElementById('status');
const micBtn = document.getElementById('micBtn');

// Auto-transliterate as you type or dictate
inputArea.addEventListener('input', () => {
  outputDiv.innerText = transliterate(inputArea.value);
});

// Speech Recognition Setup
const Speech = window.SpeechRecognition || window.webkitSpeechRecognition;

if (Speech) {
  const recognition = new Speech();
  recognition.lang = 'te-IN';
  recognition.interimResults = true;

  micBtn.onclick = () => {
    try { recognition.start(); } catch(e) { recognition.stop(); }
  };

  recognition.onstart = () => {
    micBtn.classList.add('active');
    statusDiv.innerText = "SYSTEM MIC ACTIVE";
  };

  recognition.onend = () => {
    micBtn.classList.remove('active');
    statusDiv.innerText = "";
  };

  recognition.onresult = (e) => {
    const t = Array.from(e.results).map(r => r[0].transcript).join('');
    inputArea.value = t;
    outputDiv.innerText = transliterate(t);
  };
} else {
  // If Chrome on iPhone, we hide the specialized mic button and tell them to use the keyboard
  micBtn.style.display = "none";
  statusDiv.innerText = "USE KEYBOARD MIC ICON";
}

function copyText() {
  navigator.clipboard.writeText(outputDiv.innerText);
  statusDiv.innerText = "COPIED!";
  setTimeout(() => statusDiv.innerText = "", 2000);
}

function clearAll() {
  inputArea.value = "";
  outputDiv.innerText = "...";
}
</script>

</body>
</html>
