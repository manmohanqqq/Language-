<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<title>Telugu Voice Typing</title>

<!-- Telugu → English Transliteration Library -->
<script src="https://unpkg.com/@indic-transliteration/sanscript"></script>

<style>
  body {
    margin: 0;
    font-family: system-ui, Arial, sans-serif;
    background: #f2f2f2;
  }

  .container {
    max-width: 420px;
    margin: auto;
    background: #ffffff;
    min-height: 100vh;
    padding: 20px;
  }

  h2 {
    text-align: center;
  }

  .label {
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 5px;
  }

  textarea {
    width: 100%;
    height: 90px;
    font-size: 17px;
    padding: 10px;
    border-radius: 8px;
    border: 1px solid #ccc;
    resize: none;
  }

  .mic-btn {
    width: 100%;
    background: #25D366;
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 20px;
    padding: 15px;
    margin-top: 20px;
    cursor: pointer;
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }

  .actions button {
    flex: 1;
    font-size: 16px;
    padding: 10px;
    border-radius: 8px;
    border: none;
    background: #007bff;
    color: white;
    cursor: pointer;
  }
</style>
</head>

<body>

<div class="container">
  <h2>🎤 Telugu Voice Typing</h2>

  <div class="label">తెలుగు వాక్యం</div>
  <textarea id="telugu" placeholder="మీ మాటలు ఇక్కడ వస్తాయి..."></textarea>

  <div class="label">English (WhatsApp Ready)</div>
  <textarea id="english" placeholder="naaku telugu chaalaa ishtam"></textarea>

  <button class="mic-btn" onclick="startVoice()">🎙️ మాట్లాడండి</button>

  <div class="actions">
    <button onclick="copyText()">📋 Copy</button>
    <button onclick="saveText()">💾 Save</button>
  </div>
</div>

<script>
function startVoice() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    alert("Please use Google Chrome");
    return;
  }

  const recognition = new SpeechRecognition();
  recognition.lang = "te-IN";

  recognition.onresult = function(event) {
    const teluguText = event.results[0][0].transcript;
    document.getElementById("telugu").value = teluguText;
    document.getElementById("english").value =
      Sanscript.t(teluguText, "telugu", "itrans");
  };

  recognition.start();
}

function copyText() {
  const text = document.getElementById("english");
  text.select();
  document.execCommand("copy");
  alert("Copied 👍 Paste in WhatsApp");
}

function saveText() {
  const text = document.getElementById("english").value;
  const blob = new Blob([text], { type: "text/plain" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "telugu-english.txt";
  link.click();
}
</script>

</body>
</html>
